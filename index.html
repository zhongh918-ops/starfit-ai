<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StarFit AI · 明星 × 年轻人趋势 × 品牌匹配</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #181b22;
    --line: #2a2f3a;
    --text: #f4efe6;
    --muted: #9aa3b2;
    --accent: #d4a373;
    --accent-2: #7dd3c7;
    --good: #7dcea0;
    --warn: #f0c14b;
    --bad: #e07a5f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Noto Sans SC", Inter, sans-serif;
    background: radial-gradient(1200px 600px at 10% -10%, #243044 0%, var(--bg) 50%);
    color: var(--text);
    min-height: 100vh;
    padding: 28px 20px 80px;
  }
  .wrap { max-width: 1120px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 28px; }
  h1 { font-size: 28px; letter-spacing: .04em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .grid { display: grid; grid-template-columns: 340px 1fr; gap: 18px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: color-mix(in srgb, var(--card) 92%, transparent);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
  }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 6px; }
  select, input, textarea {
    width: 100%; background: #12141a; color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14px;
  }
  textarea { min-height: 72px; resize: vertical; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .tag {
    font-size: 12px; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted);
  }
  .tag.on { background: #2a2118; border-color: var(--accent); color: var(--accent); }
  .tag.add { background: #142422; border-color: var(--accent-2); color: var(--accent-2); }
  .tag.warn { background: #2a2414; border-color: var(--warn); color: var(--warn); }
  button.run {
    width: 100%; margin-top: 16px; padding: 12px 14px; border: 0; border-radius: 12px;
    background: linear-gradient(135deg, #d4a373, #c08552); color: #1a120c;
    font-weight: 700; cursor: pointer; font-size: 15px;
  }
  button.run:hover { filter: brightness(1.08); }
  button.ghost {
    width: 100%; margin-top: 8px; padding: 10px 14px; border-radius: 12px;
    background: transparent; color: var(--accent-2); border: 1px solid #2d4a46; cursor: pointer;
  }
  button.ghost:disabled { opacity: .5; cursor: wait; }
  .livebar {
    display: flex; align-items: center; gap: 10px; justify-content: flex-end; flex-wrap: wrap;
    font-size: 12px; color: var(--muted);
  }
  a.share {
    color: var(--accent-2); text-decoration: none; border: 1px solid #2d4a46;
    padding: 5px 10px; border-radius: 8px; white-space: nowrap;
  }
  a.share:hover { filter: brightness(1.1); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px var(--good); }
  .dot.off { background: var(--warn); box-shadow: none; }
  .flow {
    display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 16px;
    position: sticky; top: 8px; z-index: 30; padding: 8px 0;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
  }
  .flow button {
    font: inherit; font-size: 11px; font-weight: 700; letter-spacing: .08em;
    color: var(--muted); padding: 7px 12px; border: 1px solid var(--line);
    border-radius: 8px; background: #14171e; cursor: pointer;
  }
  .flow button:hover { color: var(--text); border-color: var(--accent-2); }
  .flow button.on { color: var(--accent); border-color: var(--accent); background: #2a2118; }
  #panel-product, #trend-explorer, #panel-tags, #panel-tag, #panel-ranking, #panel-campaign, #panel-product-out {
    scroll-margin-top: 56px;
  }
  .search-wrap { position: relative; margin: 10px 0 14px; }
  .search-drop {
    display: none; position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 6px);
    background: #12151c; border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  }
  .search-drop.show { display: block; }
  .search-item {
    width: 100%; text-align: left; background: transparent; border: 0; color: var(--text);
    padding: 10px 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; align-items: center;
  }
  .search-item:hover { background: #1c2230; }
  .trend-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .trend-card {
    border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: #14171e; scroll-margin-top: 18px;
  }
  .trend-card.hl { border-color: var(--accent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent); }
  .trend-card h4 { font-size: 14px; margin-bottom: 4px; }
  .arrow { color: var(--good); font-weight: 700; }
  .arrow.down { color: var(--bad); }
  .arrow.flat { color: var(--warn); }
  .mini { font-size: 11px; color: var(--muted); margin: 4px 0 8px; }
  button.tiny {
    width: auto; margin: 0; padding: 6px 10px; font-size: 11px; border-radius: 8px;
    background: #1b2a28; color: var(--accent-2); border: 1px solid #2d4a46; cursor: pointer;
  }
  .celeb { display: grid; grid-template-columns: 72px 1fr auto; gap: 12px; align-items: start; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: #14171e; }
  .celeb.open { grid-template-columns: 1fr; }
  .celeb-detail {
    grid-column: 1 / -1; border-top: 1px dashed var(--line); padding-top: 14px; margin-top: 6px;
    display: grid; gap: 14px;
  }
  .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; font-size: 13px; }
  @media (max-width: 700px) { .profile-grid, .fit-grid { grid-template-columns: 1fr; } }
  .profile-grid b { display: block; font-size: 11px; color: var(--muted); font-weight: 500; }
  .fit-grid { display: grid; grid-template-columns: 1fr 200px; gap: 16px; align-items: center; }
  .match-col h4, .market h4, .works h4 { font-size: 13px; color: var(--accent); margin-bottom: 8px; letter-spacing: .04em; }
  .pair { display: grid; grid-template-columns: 72px 1fr 40px; gap: 8px; align-items: center; font-size: 11px; color: var(--muted); margin: 5px 0; }
  .pair i { display: block; height: 7px; background: #2c3340; border-radius: 99px; overflow: hidden; }
  .pair i em { display: block; height: 100%; background: var(--accent-2); }
  .pair.strong i em { background: var(--good); }
  .pair.partial i em { background: var(--warn); }
  .market-score { font-size: 28px; color: var(--accent-2); font-variant-numeric: tabular-nums; }
  .market-score small { display: block; font-size: 11px; color: var(--muted); }
  .note-chip { font-size: 11px; color: var(--warn); border: 1px dashed var(--line); border-radius: 8px; padding: 6px 8px; }
  .works li { font-size: 13px; color: #d7dde8; margin: 4px 0 4px 16px; }
  .rank { display: grid; gap: 12px; }
  .celeb { display: grid; grid-template-columns: 72px 1fr auto; gap: 12px; align-items: start; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: #14171e; }
  .score { font-size: 28px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .score small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
  .why { font-size: 13px; color: #d7dde8; line-height: 1.55; margin-top: 6px; }
  .bars { display: grid; gap: 4px; margin-top: 8px; }
  .bar { display: grid; grid-template-columns: 64px 1fr 36px; gap: 8px; align-items: center; font-size: 11px; color: var(--muted); }
  .bar i { display: block; height: 6px; background: #2c3340; border-radius: 99px; overflow: hidden; }
  .bar i em { display: block; height: 100%; background: var(--accent-2); }
  .campaign { margin-top: 16px; }
  .slogan { font-size: 20px; color: var(--accent); margin: 8px 0; }
  .muted { color: var(--muted); font-size: 12px; }
  .source { font-size: 11px; color: var(--warn); border: 1px dashed #4a3f2a; border-radius: 8px; padding: 8px 10px; margin: 8px 0 14px; line-height: 1.5; }
  .kv { display: grid; grid-template-columns: 132px 1fr; gap: 6px 12px; font-size: 13px; }
  .kv b { color: var(--muted); font-weight: 500; font-size: 11px; }
  .score-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
  @media (max-width: 700px) { .score-row { grid-template-columns: 1fr 1fr; } .kv { grid-template-columns: 1fr; } }
  .metric { background: #12151c; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .metric em { font-style: normal; font-size: 18px; color: var(--accent-2); font-variant-numeric: tabular-nums; display: block; }
  .metric span { display: block; font-size: 10px; color: var(--muted); }
  .rec { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
  .kw { font-size: 11px; color: #b7c0cc; }
  h3.sec { font-size: 15px; margin: 18px 0 8px; letter-spacing: .03em; }
  .pair.weak i em { background: #5a6270; }
  .risks li { font-size: 13px; color: #d7dde8; margin: 4px 0 4px 16px; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 99px; }
  .pill.keep { background: #1d3a2c; color: var(--good); }
  .pill.add { background: #16332f; color: var(--accent-2); }
  .pill.caution { background: #3a3014; color: var(--warn); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
  td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); color: var(--muted); }
  th { color: #c5cdd8; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>StarFit <span>AI</span></h1>
      <p class="sub">实时网站：热榜来自本机 TrendRadar，匹配分数随最新数据重算。</p>
    </div>
    <div class="livebar">
      <span class="dot" id="dot"></span><span id="liveMeta">连接中…</span>
      <a id="shareLink" class="share" href="https://fastly.jsdelivr.net/gh/zhongh918-ops/starfit-ai@main/index.html" target="_blank" rel="noopener">发给同事用这个</a>
    </div>
  </header>

  <nav class="flow" id="flowNav" aria-label="流程跳转">
    <button type="button" data-go="panel-product" class="on">1 PRODUCT</button>
    <button type="button" data-go="trend-explorer">2 TREND SEARCH</button>
    <button type="button" data-go="panel-tag">3 TAG</button>
    <button type="button" data-go="panel-ranking">4 CELEBRITY FIT</button>
    <button type="button" data-go="panel-campaign">5 CAMPAIGN</button>
  </nav>

  <section id="trend-explorer" class="card" style="margin-bottom:18px">
    <h3>Trend Explorer · TAG 搜索</h3>
    <p class="muted">搜索趋势 TAG，跳转到对应卡片，并可加入当前产品 TAG Profile。</p>
    <div class="search-wrap">
      <input id="tagSearch" placeholder="Search a trend or tag... Outdoor / Sports / Technology / Health / Fashion" autocomplete="off">
      <div id="tagResults" class="search-drop"></div>
    </div>
    <div id="trendCards" class="trend-grid"></div>
  </section>

  <div class="grid">
    <aside class="card" id="panel-product">
      <label>产品（可切换 3 个测试品）</label>
      <select id="product"></select>
      <label>产品描述 / 关键词</label>
      <textarea id="desc" placeholder="输入卖点或关键词，例如：时尚、美妆、情绪价值。改完点「跑通匹配」。"></textarea>
      <label>目标人群</label>
      <input id="audience" value="18-28">
      <label>从描述识别出的 TAG</label>
      <div class="tags" id="seedTags"></div>
      <span id="panel-tags"></span>
      <button class="run" id="run">跑通匹配</button>
      <button class="ghost" id="refresh">抓取最新热榜（约 1 分钟）</button>
      <p class="muted" style="margin-top:10px" id="hint">只推荐明星库内的公开明星，不推荐 KOL/KOC。匹配分为 Model-Based / Synthetic Demo Score，不是第三方官方分数。</p>
    </aside>
    <main id="out" class="card"><p class="muted">选择产品后点击跑通。系统会用趋势库判断 TAG 是否成立，再匹配 Top 3 明星并生成 slogan。</p></main>
  </div>
</div>
<script>
const state = { trends: null, celebrities: null, products: null, meta: null, seeded: false, pinnedTags: [], openCeleb: null };

function setLive() {
  const m = state.meta || {};
  const live = !!m.live;
  const today = m.today_items != null ? `今日 ${m.today_items} 条` : '';
  const when = (m.source_mtime || m.generated_at || '').replace('T', ' ').slice(0, 19);
  const clock = new Date().toTimeString().slice(0, 8);
  document.getElementById('liveMeta').textContent = live
    ? `实时 ${clock} · ${today} · 热榜 ${when || '—'}`
    : `公开网页 · 热榜 ${when || '—'} · ${today}`;
  document.getElementById('dot').classList.toggle('off', !live);
  document.querySelector('.sub').textContent = live
    ? '实时网站：热榜来自本机 TrendRadar，匹配分数随最新数据重算。'
    : '公开网页：github.io 在国内常打不开。热榜由本机每 30 分钟抓一次后自动发布。';
  document.getElementById('refresh').hidden = !live;
  document.getElementById('hint').textContent = live
    ? '本机实时页只有同一 Wi-Fi 能开。发给外网同事请点右上角「发给同事用这个」。'
    : '这是公开快照。github.io 在国内常打不开；请用 jsDelivr 链接。分数含 Synthetic Demo。';
}

async function fetchState() {
  try {
    const r = await fetch('/api/state', { cache: 'no-store' });
    const ct = r.headers.get('content-type') || '';
    if (r.ok && ct.includes('application/json')) return r.json();
  } catch (e) {}
  const r = await fetch('data/state.json?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('无法加载趋势数据');
  return r.json();
}

async function load(keepProduct) {
  const data = await fetchState();
  state.trends = data.trends;
  state.celebrities = data.celebrities;
  state.products = data.products;
  state.meta = data.meta;
  setLive();
  const sel = document.getElementById('product');
  if (!state.products.some(p => p.id === 'custom')) {
    state.products.push({ id: 'custom', name: '自定义产品', category: 'Custom', audience: '18-28', seed_tags: [], description: '' });
  }
  if (!state.seeded) {
    sel.innerHTML = '';
    state.products.forEach((x, i) => {
      const o = document.createElement('option');
      o.value = x.id; o.textContent = `${x.category} · ${x.name}`;
      if (i === 0) o.selected = true;
      sel.appendChild(o);
    });
    state.seeded = true;
  }
  if (!keepProduct) { state.pinnedTags = []; fillProduct(); }
  else syncTagsFromDesc();
  renderTrends();
  render();
}

const TAG_RULES = {
  '运动': /运动|健身|跑步|马拉松|NBA|CBA|足球|篮球|奥运|训练|瑜伽|骑行|网球|乒乓|运动员|跑鞋|球鞋|健身房|sports?|fitness|running|gym/i,
  '户外': /户外|露营|徒步|登山|旅行|自驾|city\s*walk|海边|滑雪|冲浪|川西|outdoor|camping|hiking|travel/i,
  '健康': /健康|养生|减脂|减肥|睡眠|防晒|低糖|无糖|轻食|蛋白|health/i,
  '科技': /科技|AI|人工智能|芯片|华为|苹果|小米|机器人|智能|数码|手机|耳机|降噪|折叠|tech|smart/i,
  '情绪价值': /情绪|治愈|松弛|氛围|陪伴|真诚|解压|燕麦系|healing/i,
  '便利': /便利|即饮|外卖|通勤|速溶|懒人|到家|convenient/i,
  '时尚': /时尚|穿搭|美妆|潮流|秀场|时装|造型|fashion|beauty|makeup/i,
  '体验': /体验|沉浸|快闪|线下|展览|市集|experience/i,
  '咖啡': /咖啡|拿铁|冷萃|美式|咖啡因|茶姬|coffee|latte/i,
  '活力': /青春|活力|街舞|热血|燃|youth|energy/i
};
const EN_ALIAS = { sports:'运动', sport:'运动', fitness:'运动', running:'运动', gym:'运动', outdoor:'户外', outdoors:'户外', health:'健康', tech:'科技', fashion:'时尚', beauty:'时尚', makeup:'时尚', coffee:'咖啡' };

function extractTags(text) {
  const found = [];
  const seen = new Set();
  const add = t => { if (t && !seen.has(t)) { seen.add(t); found.push(t); } };
  const raw = (text || '').trim();
  if (!raw) return found;
  Object.keys(TAG_RULES).forEach(tag => { if (raw.includes(tag)) add(tag); });
  Object.keys(TAG_RULES).forEach(tag => { if (TAG_RULES[tag].test(raw)) add(tag); });
  raw.split(/[\s,，、;；/|]+/).forEach(tok => {
    const k = tok.trim().toLowerCase();
    if (EN_ALIAS[k]) add(EN_ALIAS[k]);
  });
  return found;
}

function currentSeed() {
  const extracted = extractTags(document.getElementById('desc').value);
  const p = state.products.find(x => x.id === document.getElementById('product').value);
  const base = extracted.length ? extracted : ((p && p.seed_tags) ? p.seed_tags.slice() : []);
  const extra = state.pinnedTags || [];
  return [...new Set([...base, ...extra])];
}

function syncTagsFromDesc() {
  const extracted = extractTags(document.getElementById('desc').value);
  const seed = currentSeed();
  const fallback = extracted.length === 0 && seed.length > 0 && !(state.pinnedTags || []).length;
  document.getElementById('seedTags').innerHTML = seed.map(t => {
    const pin = (state.pinnedTags || []).includes(t);
    return `<span class="tag ${pin ? 'add' : 'on'}">${t}${pin ? ' +' : ''}</span>`;
  }).join('')
    + (fallback ? '<span class="muted">描述里还没识别到关键词，暂用产品预设 TAG</span>' : '')
    + (!seed.length ? '<span class="muted">请在描述里写关键词，或从上方趋势卡加入 TAG</span>' : '');
}

function fillProduct() {
  const p = state.products.find(x => x.id === document.getElementById('product').value);
  document.getElementById('desc').value = p.description || '';
  document.getElementById('audience').value = p.audience || '18-28';
  document.getElementById('run').textContent = p.id === 'custom' ? '按描述匹配代言人' : '跑通匹配';
  syncTagsFromDesc();
}

function trendConfirmed(tr) {
  if (!tr) return false;
  return (tr.mention_count || 0) >= 8 && ((tr.today_count || 0) >= 2 || (tr.heat || 0) >= 0.25);
}

function understandProduct(product, desc, audience, seed) {
  const text = desc || product.description || '';
  const price = product.price_level || (/轻奢|高端|奢/.test(text) ? 'Premium' : /平价|性价比/.test(text) ? 'Value' : '未提供');
  const features = (product.features && product.features.length) ? product.features : extractTags(text);
  const scenarios = (product.scenarios && product.scenarios.length) ? product.scenarios : [];
  const image = product.desired_image || (/年轻|活力/.test(text) ? 'Young, energetic' : '未提供');
  const objective = product.campaign_objective || '找到最适合该产品的明星代言人，而不是热搜最高的人';
  return {
    name: product.name_en || product.name,
    name_zh: product.name,
    category: product.category || 'Custom',
    audience: audience || product.audience || '18-28',
    price, features, scenarios, image, objective, seed, text
  };
}

function buildProductProfile(seedTags, product, trends, desc) {
  const result = [];
  const seen = new Set();
  const cat = product.category || '';
  const text = desc || '';
  const push = (tag, origin, why, forceScore) => {
    if (seen.has(tag) || !tag) return;
    const tr = trends[tag] || { heat: 0.25, verdict: 'keep', note: '趋势库暂无独立热度。', evidence: [], mention_count: 0, today_count: 0 };
    let score = Math.round(50 + 48 * (tr.heat || 0));
    if (origin === 'seed') score = Math.min(98, score + 16);
    if (tr.verdict === 'caution') score = Math.round(score * 0.7);
    if (forceScore != null) score = forceScore;
    score = Math.max(8, Math.min(98, score));
    seen.add(tag);
    result.push({
      tag, origin, why,
      score,
      weight: score / 100,
      heat: tr.heat || 0,
      verdict: tr.verdict,
      note: tr.note,
      confirmed: trendConfirmed(tr),
      evidence: (tr.evidence || []).slice(0, 2),
      mention_count: tr.mention_count || 0,
      today_count: tr.today_count || 0
    });
  };

  seedTags.forEach(tag => {
    let why = '用户选择 / 描述识别，予以保留并按热榜信号校准。';
    let force = null;
    if (cat === 'Coffee') {
      if (tag === '户外') { force = trends[tag]?.verdict === 'caution' ? 72 : 95; why = '即饮场景与轻户外高度相关；若热榜含风险新闻会降权。'; }
      if (tag === '运动') { force = 92; why = '训练/骑行/通勤补给是核心使用场景。'; }
      if (tag === '科技' && !/智能硬件|芯片|传感器|APP/.test(text)) { force = 76; why = '用户选了科技，但对即饮咖啡偏弱相关，模型降权（非删除）。'; }
    }
    if (cat === 'Sports Shoes' && tag === '运动') { force = 95; why = '品类主轴就是运动训练。'; }
    if (cat === 'Smart Headphones' && tag === '科技') { force = 95; why = '智能硬件主轴。'; }
    push(tag, 'seed', why, force);
  });

  const extras = [];
  if (cat === 'Coffee') {
    extras.push(['便利', 90, '即饮刚需，模型建议补入。']);
    extras.push(['健康', 88, '低糖/清爽定位与健康感相关，模型建议补入。']);
    extras.push(['情绪价值', 82, '随身补给可承接陪伴/松弛，模型建议补入。']);
  }
  if (cat === 'Sports Shoes') extras.push(['健康', 80, '训练场景常与健康生活方式重叠。']);
  if (cat === 'Smart Headphones') extras.push(['便利', 78, '通勤降噪属于便利场景。']);
  extras.forEach(([tag, score, why]) => {
    if (!seedTags.includes(tag)) push(tag, 'recommend', why, score);
  });

  return result.sort((a, b) => b.score - a.score);
}

function ageFit(celeb) {
  const aud = document.getElementById('audience').value || '';
  const s = celeb.fan_profile.age_split;
  if (/18\s*[-–]\s*24/.test(aud) && !/25/.test(aud)) return s['18-24'] || 0;
  if (/29\s*[-–]\s*35/.test(aud)) return s['29-35'] || 0;
  return (s['18-24'] || 0) + (s['25-28'] || 0);
}

function brandImageFit(celeb, product, optTags) {
  const desired = `${product.desired_image || ''} ${document.getElementById('desc').value || ''}`;
  const keys = [];
  if (/年轻|青春|youth|energetic|活力|燃/.test(desired)) keys.push('活力');
  if (/运动|athletic|sports/.test(desired)) keys.push('运动');
  if (/现代|科技|modern|tech/.test(desired)) keys.push('科技');
  if (/户外|outdoor/.test(desired)) keys.push('户外');
  if (/时尚|fashion/.test(desired)) keys.push('时尚');
  if (/真诚|authentic/.test(desired)) keys.push('真诚');
  if (/情绪|陪伴|calm/.test(desired)) keys.push('情绪价值');
  optTags.slice(0, 4).forEach(t => { if (!keys.includes(t.tag)) keys.push(t.tag); });
  if (!keys.length) return 0.5;
  return keys.reduce((s, tag) => s + (celeb.tags[tag] || 0), 0) / keys.length;
}

function matchOne(optTags, celeb, product) {
  let num = 0, den = 0;
  const hits = [];
  optTags.forEach(t => {
    const cv = celeb.tags[t.tag] || 0;
    const w = (t.score || 50) / 100;
    num += w * cv;
    den += w;
    if (cv >= 0.55) hits.push({ tag: t.tag, product: w, celeb: cv });
  });
  const tagScore = den ? num / den : 0;
  const ageScore = ageFit(celeb);
  const market = marketDemandFit(celeb, optTags);
  const brandScore = brandImageFit(celeb, product, optTags);
  const engagement = Math.min(1, 0.25 + 0.75 * Math.log(1 + (celeb.heat_mentions || 0)) / Math.log(17));
  const riskPenalty = (celeb.risk?.score || 0) * 0.12;
  const raw = 0.35 * tagScore + 0.20 * (market.score / 100) + 0.20 * ageScore + 0.15 * brandScore + 0.10 * engagement;
  const final = Math.max(0, Math.min(1, raw - riskPenalty));
  return {
    celeb, tagScore, ageScore, brandScore, engagement, market,
    heatScore: engagement, riskScore: 1 - (celeb.risk?.score || 0),
    final,
    hits: hits.sort((a, b) => b.celeb - a.celeb).slice(0, 5)
  };
}

function trendArrow(tag) {
  const t = (state.trends || {})[tag];
  if (!t) return { mark: '→', cls: 'flat', status: 'Stable' };
  if (t.verdict === 'caution') return { mark: '↓', cls: 'down', status: 'Caution' };
  if ((t.today_count || 0) >= 8 || (t.heat || 0) >= 0.45) return { mark: '↑', cls: '', status: 'Rising' };
  return { mark: '→', cls: 'flat', status: 'Stable' };
}

function renderTrends() {

  const tags = Object.keys(state.trends);
  box.innerHTML = tags.map(tag => {

function searchTrends(q) {
  q = (q || '').trim().toLowerCase();
  if (!q) return [];
  const hits = [];
  const seen = new Set();
  const push = (tag, related) => {
    if (!tag || seen.has(tag) || !state.trends[tag]) return;
    seen.add(tag);
    const a = trendArrow(tag);
    hits.push({ tag, related, score: pct(state.trends[tag].heat), arrow: a });
  };
  if (/coffee|latte|咖啡|拿铁|冷萃/.test(q)) COFFEE_RELATED.forEach((tag, i) => push(tag, i > 0));
  const mapped = TAG_ALIAS[q];
  if (mapped) push(mapped, false);
  Object.keys(state.trends).forEach(tag => {
    const hay = `${tag} ${TAG_EN[tag] || ''}`.toLowerCase();
    if (hay.includes(q) || tag.toLowerCase().includes(q)) push(tag, false);
  });
  Object.entries(TAG_ALIAS).forEach(([k, tag]) => {
    if (k.includes(q) || q.includes(k)) push(tag, k !== q);
  });
  return hits.slice(0, 7);
}

function marketDemandFit(celeb, optTags) {
  const productTags = (optTags || []).map(t => t.tag);
  const youthKeys = ['运动', '户外', '健康', '科技', '时尚', '活力', '情绪价值'];
  const rows = youthKeys.map(tag => {
    const cv = celeb.tags[tag] || 0;
    const a = trendArrow(tag);
    const lv = cv >= 0.75 ? 'High' : cv >= 0.5 ? 'Medium' : 'Low';
    return { tag, cv, arrow: a, level: lv };
  });
  const core = [];
  productTags.forEach(tag => {
    const cv = celeb.tags[tag] || 0;
    if (cv < 0.3) return;
    const a = trendArrow(tag);
    const demand = a.mark === '↑' ? 1.06 : a.mark === '↓' ? 0.9 : 1;
    core.push(Math.min(1, cv * demand));
  });
  const score = core.length ? Math.round(100 * core.reduce((a, b) => a + b, 0) / core.length) : 0;
  return { score, rows };
}

function compatibility(optTags, celeb) {
  return optTags.map(t => {
    const product = t.score != null ? t.score / 100 : 0.5 + 0.5 * (t.heat || 0);
    const celebV = celeb.tags[t.tag] || 0;
    const fit = Math.sqrt(Math.max(0, product) * celebV);
    let kind = 'weak';
    if (fit >= 0.72 && celebV >= 0.7) kind = 'strong';
    else if (fit >= 0.5) kind = 'partial';
    return { tag: t.tag, product, celeb: celebV, fit, kind };
  }).sort((a, b) => b.fit - a.fit);
}

function radarSVG(pairs) {
  const axes = pairs.slice(0, 6);
  if (!axes.length) return '';
  const cx = 90, cy = 90, r = 70, n = axes.length;
  const pt = (i, val) => {
    const ang = -Math.PI / 2 + (Math.PI * 2 * i) / n;
    return [cx + r * val * Math.cos(ang), cy + r * val * Math.sin(ang)];
  };
  const ring = (v) => axes.map((_, i) => pt(i, v).join(',')).join(' ');
  const poly = (key) => axes.map((a, i) => pt(i, Math.max(0.05, a[key])).join(',')).join(' ');
  const labels = axes.map((a, i) => {
    const [x, y] = pt(i, 1.18);
    return `<text x="${x}" y="${y}" text-anchor="middle" fill="#9aa3b2" font-size="9">${a.tag}</text>`;
  }).join('');
  return `<svg viewBox="0 0 180 180" width="180" height="180">
    <polygon points="${ring(1)}" fill="none" stroke="#2c3340"/>
    <polygon points="${ring(0.66)}" fill="none" stroke="#2c3340"/>
    <polygon points="${ring(0.33)}" fill="none" stroke="#2c3340"/>
    <polygon points="${poly('product')}" fill="rgba(212,163,115,.18)" stroke="#d4a373"/>
    <polygon points="${poly('celeb')}" fill="rgba(125,211,199,.18)" stroke="#7dd3c7"/>
    ${labels}
  </svg><div class="mini">橙：产品 TAG　青：明星 TAG</div>`;
}

  const m = r.market?.score || 0;
  if (m < 70) risks.push('趋势相关偏弱：当前公众形象与 Rising 年轻人趋势重叠不足。');
  risks.push('品类冲突 / 以往代言：资料不可用（unavailable），未收录真实代言合同。');
  return risks;
}

    <h3 class="sec">12. Audience Fit</h3>
    <div class="kv">
      <b>Fan age (demo)</b><span>18–24 ${pct(fans.age_split?.['18-24'] || 0)}% · 25–28 ${pct(fans.age_split?.['25-28'] || 0)}% · 29–35 ${pct(fans.age_split?.['29-35'] || 0)}%</span>
      <b>Interests</b><span>${(fans.interests || []).join(' · ') || 'unavailable'}</span>
      <b>Demographic fit</b><span>Audience Fit ${pct(r.ageScore)} / 100 · Synthetic Demo</span>
      <b>Category relevance</b><span>${r.hits.map(h => h.tag).join('、') || '弱'}</span>
    </div>
    <h3 class="sec">13. Potential Risks</h3>
    <ul class="risks">${risks.map(x => `<li>${x}</li>`).join('')}</ul>
    <h3 class="sec">14. Why This Celebrity?</h3>
    <p class="why">${whyMarket(c, pairs, fit)}</p>
  </div>`;
}

function whyLine(product, r) {
  const tags = r.hits.map(h => h.tag).join('、') || '趋势 TAG';
  return `${r.celeb.name} 与「${tags}」重叠最高。连接的是产品定位 + 年轻人趋势 + 人设，而不是热搜次数。`;
}

function render(opts) {
  if (!state.trends || !state.celebrities) return;
  const product = state.products.find(x => x.id === document.getElementById('product').value) || { name: '自定义', category: 'Custom', seed_tags: [] };
  const desc = document.getElementById('desc').value;
  const audience = document.getElementById('audience').value;
  syncTagsFromDesc();
  const seed = currentSeed();
  if (!seed.length) {
    document.getElementById('out').innerHTML = '<p class="muted">请先在产品描述里输入关键词（例如：运动、时尚、科技、情绪价值），或从 Trend Explorer 加入 TAG，再点「跑通匹配」。</p>';
    return;
  }
  const brief = understandProduct(product, desc, audience, seed);
  const opt = buildProductProfile(seed, product, state.trends, desc);
  const ranked = state.celebrities.map(c => matchOne(opt, c, product)).sort((a,b) => b.final - a.final);
  const top3 = ranked.slice(0, 3);
  if (opts && opts.openTop && top3[0]) state.openCeleb = top3[0].celeb.id;
  const rec = top3[0];
  const camp = rec ? campaign(product, opt, rec, brief) : null;

  const youthRows = Object.keys(state.trends).map(tag => {
    const t = state.trends[tag];
    const a = trendArrow(tag);
    const ok = trendConfirmed(t);
    return `<tr>
      <td>${tag} / ${TAG_EN[tag] || ''}</td>
      <td><span class="arrow ${a.cls}">${a.mark}</span> ${a.status}</td>
      <td>${pct(t.heat)}</td>
      <td>${t.today_count || 0} / ${t.mention_count || 0}</td>
      <td>${ok ? '重复信号，可作趋势参考' : '孤立或过弱，不单独当作已确认趋势'}</td>
    </tr>`;
  }).join('');

  const profileBars = opt.map(t => `
    <div class="bar"><span>${t.tag}</span><i><em style="width:${t.score}%"></em></i><span>${t.score}</span></div>
    <p class="mini">${t.origin === 'recommend' ? '模型建议补入' : '用户 TAG'} · ${t.why}</p>`).join('');

  const cards = top3.map((r, i) => `
    <article class="celeb ${state.openCeleb === r.celeb.id ? 'open' : ''} ${i===0 ? 'rec' : ''}" id="celeb-${r.celeb.id}">
      <div>
        <div class="muted">${i===0 ? 'RECOMMENDED' : 'TOP ' + (i+1)}</div>
        <strong>${r.celeb.name}</strong>
        <div class="muted">${(r.celeb.occupations || []).join(' · ')}</div>
      </div>
      <div>
        <div class="tags">${r.hits.map(h => `<span class="tag on">${h.tag} ${pct(h.celeb)}</span>`).join('')}</div>
        <p class="why">${whyLine(product, r)}</p>
        <div class="score-row">
          <div class="metric"><em>${pct(r.tagScore)}</em><span>Product TAG Fit</span></div>
          <div class="metric"><em>${r.market.score}</em><span>Market Demand Fit</span></div>
          <div class="metric"><em>${pct(r.ageScore)}</em><span>Audience Fit</span></div>
          <div class="metric"><em>${pct(r.brandScore)}</em><span>Brand Image Fit</span></div>
          <div class="metric"><em>${pct(r.engagement)}</em><span>Engagement (estimate)</span></div>
          <div class="metric"><em>${r.celeb.risk.level}</em><span>Risk</span></div>
        </div>
        <p class="mini">Synthetic Demo Score · 35% TAG + 20% 趋势 + 20% 受众 + 15% 品牌形象 + 10% 互动 − 风险惩罚。不是官方统计。</p>
        <button class="tiny" data-open-celeb="${r.celeb.id}" style="margin-top:10px">${state.openCeleb === r.celeb.id ? '收起详情' : '展开 Celebrity Detail'}</button>
      </div>
      <div class="score">${pct(r.final)}<small>Fit /100</small></div>
      ${state.openCeleb === r.celeb.id ? celebDetailHTML(r, opt, product) : ''}
    </article>`).join('');

  document.getElementById('out').innerHTML = `
    <p class="source">数据分级：热榜标题条数为 TrendRadar 观测数据。TAG 分数、粉丝结构、Fit Score 为 Model-Based / Synthetic Demo Score，不是第三方调研机构发布的官方分数。只推荐明星库内的公开明星，不推荐 KOL/KOC。</p>

    <section id="panel-product-out">
      <h3 class="sec">1. Product Understanding</h3>
      <div class="kv">
        <b>Product</b><span>${brief.name_zh} · ${brief.name}</span>
        <b>Category</b><span>${brief.category}</span>
        <b>Target age</b><span>${brief.audience}</span>
        <b>Price level</b><span>${brief.price}</span>
        <b>Features</b><span>${(brief.features || []).join(' · ') || '未提供'}</span>
        <b>Scenarios</b><span>${(brief.scenarios || []).join(' · ') || '未提供'}</span>
        <b>Desired image</b><span>${brief.image}</span>
        <b>Campaign objective</b><span>${brief.objective}</span>
        <b>User-selected TAGs</b><span>${seed.join(' · ')}</span>
      </div>
    </section>

    <section>
      <h3 class="sec">2. Current Youth Trend Analysis</h3>
      <p class="muted">不把单条热词当成已确认趋势。优先看重复信号、跨平台标题、近期方向。此处无 QuestMobile / 百度指数，只有热榜标题代理。</p>
      <table>
        <tr><th>TAG</th><th>方向</th><th>Score</th><th>今日/总</th><th>是否确认</th></tr>
        ${youthRows}
      </table>
    </section>

    <section id="panel-tag">
      <h3 class="sec">3. Recommended Product TAGs</h3>
      <div class="tags" style="margin:8px 0 12px">
        ${opt.map(t => `<span class="tag ${t.origin==='recommend'?'add':(t.verdict==='caution'?'warn':'on')}">${t.tag} ${t.score}</span>`).join('')}
      </div>
      <h3 class="sec">4. Product Trend Profile</h3>
      <p class="muted">模型会保留、加权、降权或补 TAG，并说明原因。分数为模型匹配分。</p>
      ${profileBars}
    </section>

    <section id="panel-ranking">
      <h3 class="sec">5. Celebrity Candidate Ranking</h3>
      <p class="muted">仅明星库 8 人。Fit ≠ Popularity。</p>
      <h3 class="sec">6. Recommended Celebrity</h3>
      <p class="why">${rec.celeb.name} · Synthetic Demo Score ${pct(rec.final)} / 100 · 展开详情看作品、契合、风险与 Why。</p>
      <div class="rank" style="margin-top:10px">${cards}</div>
    </section>

    ${camp ? `<section class="campaign" id="panel-campaign">
      <h3 class="sec">15. Campaign Positioning</h3>
      <p class="why">${camp.positioning}</p>
      <p class="muted">${camp.concept}</p>
      <h3 class="sec">16. Main Slogan</h3>
      <div class="slogan">“${camp.main}”</div>
      <h3 class="sec">17. Alternative Slogans</h3>
      ${camp.alts.map(s => `<div class="slogan" style="font-size:16px">“${s}”</div>`).join('')}
      <h3 class="sec">18. Campaign Keywords</h3>
      <div class="tags">${camp.visual.map(k => `<span class="tag on">${k}</span>`).join('')}</div>
      <p class="mini" style="margin-top:8px">Recommended scenarios: ${camp.scenarios.join(' · ')}</p>
    </section>` : ''}
  `;
}

function setFlowStep(id) {
  document.querySelectorAll('#flowNav button').forEach(b => {
    b.classList.toggle('on', b.getAttribute('data-go') === id);
  });
}

function goStep(id) {
  if (!document.getElementById('panel-ranking') && state.trends) render();
  const el = document.getElementById(id) || (id === 'panel-tag' ? document.getElementById('panel-tags') : null)
    || (id === 'panel-ranking' || id === 'panel-campaign' ? document.getElementById('out') : null);
  if (!el) return;
  setFlowStep(id);
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

document.getElementById('flowNav').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-go]');
  if (btn) goStep(btn.getAttribute('data-go'));
});

document.getElementById('product').addEventListener('change', () => { state.pinnedTags = []; fillProduct(); render(); });
document.getElementById('run').addEventListener('click', () => {
  render({ openTop: true });
  goStep('panel-ranking');
});
let descTimer = null;
document.getElementById('desc').addEventListener('input', () => {
  syncTagsFromDesc();
  clearTimeout(descTimer);
  descTimer = setTimeout(render, 400);
});
document.getElementById('audience').addEventListener('change', render);
document.getElementById('trendCards').addEventListener('click', (e) => {
  const add = e.target.closest('[data-add-tag]');
  if (add) addProductTag(add.getAttribute('data-add-tag'));
});
document.getElementById('tagSearch').addEventListener('input', (e) => showSearchResults(e.target.value));
document.getElementById('tagSearch').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const hits = searchTrends(e.target.value);
    if (hits[0]) jumpToTrend(hits[0].tag);
  }
  if (e.key === 'Escape') document.getElementById('tagResults').classList.remove('show');
});
document.getElementById('tagResults').addEventListener('click', (e) => {
  const add = e.target.closest('[data-add-tag]');
  if (add) {
    e.stopPropagation();
    addProductTag(add.getAttribute('data-add-tag'));
    return;
  }
  const item = e.target.closest('[data-jump-tag]');
  if (item) jumpToTrend(item.getAttribute('data-jump-tag'));
});
document.getElementById('out').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-open-celeb]');
  if (!btn) return;
  const id = btn.getAttribute('data-open-celeb');
  state.openCeleb = state.openCeleb === id ? null : id;
  render();
  const el = document.getElementById('celeb-' + id);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrap')) document.getElementById('tagResults').classList.remove('show');
});
document.getElementById('refresh').addEventListener('click', async () => {
  const btn = document.getElementById('refresh');
  btn.disabled = true;
  btn.textContent = '正在抓取热榜…';
  await fetch('/api/refresh', { method: 'POST' });
  const tick = setInterval(async () => {
    const s = await fetch('/api/refresh/status').then(r => r.json());
    btn.textContent = s.running ? '正在抓取热榜…' : (s.error ? '抓取失败，点击重试' : '热榜已更新');
    if (!s.running) {
      clearInterval(tick);
      btn.disabled = false;
      if (!s.error) {
        await load(true);
        btn.textContent = '抓取最新热榜（约 1 分钟）';
      }
    }
  }, 1500);
});
load().catch(err => {
  document.getElementById('dot').classList.add('off');
  document.getElementById('out').innerHTML = `<p class="muted">网站未启动。在 starfit-ai 目录运行：<br><code>python3 app.py</code><br>然后打开 http://localhost:8765/<br>${err}</p>`;
});
setInterval(() => { if (state.meta && state.meta.live) setLive(); }, 1000);
setInterval(() => { if (state.trends && state.meta && state.meta.live) load(true).catch(() => {}); }, 8000);
</script>
</body>
</html>
