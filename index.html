<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>99% match</title>
<script src="js/public-base.js"></script>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/marketing.css">
</head>
<body data-page="opening">
<div class="page">
  <div class="app-window" role="application" aria-label="99% match">
    <header class="app-chrome marketing">
      <div class="traffic" aria-hidden="true">
        <span class="tl close"></span><span class="tl min"></span><span class="tl max"></span>
      </div>
      <div class="marketing-head">
        <p class="chrome-kicker" data-i18n="open.kicker">We match products with the people who can move culture—using signals, not popularity alone.</p>
        <div class="mnav-row">
          <nav class="mnav" aria-label="Primary">
            <a href="work.html" data-nav="work" data-i18n="nav.work">Work</a>
            <a href="about.html" data-nav="about" data-i18n="nav.about">About</a>
            <a href="contact.html" data-nav="contact" data-i18n="nav.contact">Contact</a>
            <a href="support.html" data-nav="support" data-i18n="nav.support">Support</a>
          </nav>
          <div data-lang-switch></div>
        </div>
      </div>
    </header>
    <div class="market-body">
      <section class="opening">
        <h1 class="opening-mark">99% match</h1>
        <div class="opening-row">
          <figure>
            <img class="media-cover" src="assets/opening/opening-01-run-club.png" width="475" height="565" data-i18n-alt="open.alt1" alt="Run club crossing a street in motion">
          </figure>
          <figure>
            <img class="media-cover" src="assets/opening/opening-02-editorial-headphones.png" width="451" height="565" data-i18n-alt="open.alt2" alt="Editorial portrait with headphones, brand marks removed">
          </figure>
          <figure>
            <img class="media-cover" src="assets/opening/opening-03-fashion-tech-portrait.png" width="474" height="565" data-i18n-alt="open.alt3" alt="Fashion and tech street portrait">
          </figure>
        </div>
      </section>
    </div>
  </div>
</div>
<script src="js/i18n.js"></script>
<script src="js/nav.js"></script>
</body>
</html>
