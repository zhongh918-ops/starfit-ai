<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>99% match · 实时工作台</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "PingFang SC", "Noto Sans SC", sans-serif;
      background: #f4f1ea;
      color: #1c1917;
    }
    .card {
      width: min(440px, calc(100% - 32px));
      padding: 28px 26px;
      border: 1px solid #e4ddd0;
      border-radius: 16px;
      background: #fffdf8;
    }
    .kicker { margin: 0 0 8px; font-size: 12px; letter-spacing: 0.08em; color: #78716c; text-transform: uppercase; }
    h1 { margin: 0 0 10px; font-size: 22px; }
    p { margin: 0 0 12px; line-height: 1.5; color: #44403c; }
    .status { font-size: 14px; color: #57534e; }
    a { color: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <p class="kicker">99% match</p>
    <h1>正在打开实时工作台</h1>
    <p class="status" id="status">正在查找当前在线地址…</p>
    <p id="fallback" hidden>
      实时站暂时离线。可先看公开快照：
      <a href="./work.html">work.html</a>
    </p>
  </div>
  <script>
    const statusEl = document.getElementById("status");
    const fallbackEl = document.getElementById("fallback");
    const bust = Date.now();
    const sources = [
      new URL("live-url.json?t=" + bust, location.href).href,
      "https://zhongh918-ops.github.io/starfit-ai/live-url.json?t=" + bust,
      "https://raw.githubusercontent.com/zhongh918-ops/starfit-ai/main/live-url.json?t=" + bust,
      "https://cdn.jsdelivr.net/gh/zhongh918-ops/starfit-ai@main/live-url.json"
    ];

    function workUrl(data) {
      if (!data) return "";
      if (data.work) return data.work;
      if (data.url) return String(data.url).replace(/\/$/, "") + "/work";
      return "";
    }

    async function readSource(src) {
      const res = await fetch(src, { cache: "no-store" });
      if (!res.ok) throw new Error("bad status");
      return res.json();
    }

    async function openLive() {
      for (const src of sources) {
        try {
          const data = await readSource(src);
          const dest = workUrl(data);
          if (!dest) continue;
          statusEl.textContent = "已找到实时站，正在跳转…";
          location.replace(dest);
          return;
        } catch (err) {
          /* try next source */
        }
      }
      statusEl.textContent = "没有找到正在运行的实时站。";
      fallbackEl.hidden = false;
    }

    openLive();
  </script>
</body>
</html>
